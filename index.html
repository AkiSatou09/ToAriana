<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Under the same moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  /* A night scene: dark in every viewer theme. */
  :root {
    --night: #070514;
    --blush: #fbe6e8;
    --blush-dim: rgba(251, 230, 232, 0.68);
    --rose: #f0a3ba;
    --gold: #f5dcae;
    --hair: rgba(251, 230, 232, 0.24);
    --glass: rgba(12, 7, 28, 0.52);
    --script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0;
    background: var(--night);
    color: var(--blush);
    font-family: var(--serif);
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; z-index: 0; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { display: block; }
  #fx { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 52%, rgba(3, 2, 10, 0.55) 100%);
  }
  #progress {
    position: fixed;
    top: 0; left: 0;
    height: 2.5px;
    width: 0%;
    z-index: 9;
    background: linear-gradient(90deg, var(--rose), var(--gold));
    box-shadow: 0 0 10px rgba(245, 160, 190, 0.6);
    opacity: 0;
    transition: opacity 1s ease 0.6s;
  }
  body.ready #progress { opacity: 1; }
  main { position: relative; z-index: 2; pointer-events: none; }
  main button, main img, main figure { pointer-events: auto; }

  /* ---------- Opening ---------- */
  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 0 6vw 11vh;
  }
  .hero h1 {
    margin: 0;
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(50px, 10vw, 112px);
    line-height: 1.08;
    color: var(--gold);
    text-shadow: 0 0 44px rgba(245, 160, 190, 0.5), 0 2px 14px rgba(0, 0, 0, 0.55);
  }
  .hero p {
    margin: 14px 0 0;
    max-width: 34ch;
    font-style: italic;
    font-size: clamp(18px, 2vw, 22px);
    line-height: 1.4;
    color: var(--blush-dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
  }
  .cue {
    width: 1px;
    height: 48px;
    margin-top: 24px;
    background: linear-gradient(to bottom, rgba(251, 230, 232, 0), rgba(251, 230, 232, 0.75));
    transform-origin: top;
    animation: cue 2.6s ease-in-out infinite;
  }
  @keyframes cue {
    0%, 100% { transform: scaleY(0.35); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  .hero > * {
    opacity: 0;
    transform: translateY(12px);
    filter: blur(8px);
    transition: opacity 2.4s cubic-bezier(0.22, 1, 0.36, 1), transform 2.4s cubic-bezier(0.22, 1, 0.36, 1), filter 2.4s ease;
  }
  body.ready .hero > * { opacity: 1; transform: none; filter: none; }
  body.ready .hero > :nth-child(2) { transition-delay: 0.7s; }

  /* ---------- Poem ---------- */
  .stanza {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    padding: 8vh 8vw;
  }
  .stanza.right { justify-content: flex-end; }
  .block { position: relative; width: min(34rem, 46vw); }
  .block::before {
    content: "";
    position: absolute;
    inset: -10vh -8vw;
    background: radial-gradient(closest-side, rgba(7, 5, 20, 0.62), rgba(7, 5, 20, 0));
    z-index: -1;
  }
  .line, .rv {
    opacity: 0;
    filter: blur(6px);
    transform: translateY(10px);
    transition: opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1), filter 1.5s ease, transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .line {
    display: block;
    margin: 0 0 0.5em;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(21px, 2.5vw, 37px);
    line-height: 1.75;
    letter-spacing: 0.006em;
    color: var(--blush);
    text-shadow: 0 0 26px rgba(255, 160, 195, 0.32), 0 1px 3px rgba(0, 0, 0, 0.6);
  }
  .line:last-child { margin-bottom: 0; }
  .stanza.in .line, .stanza.in .rv {
    opacity: 1;
    filter: none;
    transform: none;
    transition-delay: calc(var(--i) * 0.5s);
  }

  /* Heart of stars: caption sits at the foot of the screen */
  .stanza.heart { align-items: flex-end; justify-content: center; padding: 0 7vw 8vh; }
  .stanza.heart .block { width: min(36rem, 88vw); text-align: center; }
  .stanza.heart .block::before { inset: -8vh -8vw; }

  /* ---------- Photo gallery ---------- */
  .stanza.gallery { flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 14vh 6vw 10vh; }
  .stanza.gallery .block { width: min(50rem, 92vw); }
  .stanza.gallery .block::before { inset: -6vh -6vw; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4vw 3vw;
    margin: 0.9em auto 0;
    max-width: 46rem;
  }
  .polaroid {
    margin: 0;
    background: #f7f1ea;
    padding: 8px 8px 22px;
    border-radius: 3px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
    transform: rotate(var(--r, 0deg));
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .polaroid:hover, .polaroid:focus-visible { transform: rotate(0deg) scale(1.04); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55); }
  .polaroid:nth-child(1) { --r: -4deg; }
  .polaroid:nth-child(2) { --r: 3deg; }
  .polaroid:nth-child(3) { --r: -2deg; }
  .polaroid:nth-child(4) { --r: 2deg; }
  .polaroid:nth-child(5) { --r: -3deg; }
  .polaroid:nth-child(6) { --r: 4deg; }
  .polaroid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border-radius: 1px; background: #1a1620; }
  .polaroid.broken img { display: none; }
  .polaroid .fallback {
    display: none;
    aspect-ratio: 1 / 1;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    border: 1px dashed rgba(20, 15, 25, 0.35);
    color: rgba(20, 15, 25, 0.55);
    font-size: 13px;
    font-style: italic;
  }
  .polaroid.broken .fallback { display: flex; }
  .polaroid .fallback b { font-size: 22px; }
  .polaroid button { all: unset; display: block; cursor: pointer; width: 100%; }
  .polaroid button:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    background: rgba(5, 3, 12, 0.93);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #lightbox.show { opacity: 1; pointer-events: auto; }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
  }

  .sign {
    display: block;
    margin-top: 0.7em;
    font-family: var(--script);
    font-size: clamp(38px, 5vw, 62px);
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 0 34px rgba(245, 160, 190, 0.5), 0 2px 10px rgba(0, 0, 0, 0.55);
  }
  .again {
    font: inherit;
    font-size: 19px;
    font-style: italic;
    color: var(--blush);
    background: var(--glass);
    border: 1px solid var(--hair);
    border-radius: 999px;
    padding: 8px 24px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: background 0.2s, border-color 0.2s;
  }
  .again:hover { background: rgba(240, 163, 186, 0.2); }
  button:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

  /* ---------- Sound toggle ---------- */
  #soundBtn {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    z-index: 9;
    display: none;
    align-items: center;
    font: inherit;
    font-size: 17px;
    color: var(--blush);
    background: var(--glass);
    border: 1px solid var(--hair);
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease 0.4s;
  }
  body.loaded #soundBtn { opacity: 1; pointer-events: auto; }
  body.ready #soundBtn.available { display: inline-flex; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-right: 9px; }
  .eq i { display: block; width: 2px; height: 12px; background: currentColor; border-radius: 1px; transform-origin: bottom; transform: scaleY(0.3); }
  #soundBtn[aria-pressed="true"] .eq i { animation: eq 1.1s ease-in-out infinite; }
  #soundBtn[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: 0.25s; }
  #soundBtn[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: 0.5s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }

  /* ---------- Gate: the sound question ---------- */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 7vw;
    background: radial-gradient(ellipse at center, rgba(7, 5, 20, 0.35), rgba(7, 5, 20, 0.82));
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  body.loaded #gate { opacity: 1; pointer-events: auto; }
  body.ready #gate { opacity: 0; pointer-events: none; }
  #gateLine {
    margin: 0;
    font-family: var(--script);
    font-size: clamp(42px, 8vw, 84px);
    line-height: 1.1;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(245, 160, 190, 0.5);
  }
  .gate-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 38px; }
  .gate-actions button {
    font: inherit; font-size: 19px; font-style: italic; color: var(--blush);
    background: var(--glass); border: 1px solid var(--hair); border-radius: 999px;
    padding: 8px 24px; cursor: pointer; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .gate-actions button:hover { background: rgba(240, 163, 186, 0.2); }
  .gate-actions button.solid { background: rgba(240, 163, 186, 0.26); border-color: rgba(240, 163, 186, 0.6); }

  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--night);
    font-style: italic;
    font-size: 24px;
    color: var(--blush-dim);
    transition: opacity 1.4s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }

  /* ---------- Tall, narrow screens: the Moon rises above the words ---------- */
  @media (max-aspect-ratio: 1/1) {
    .stanza:not(.gallery) { align-items: flex-end; padding: 0 7vw 9vh; }
    .stanza.left, .stanza.right { justify-content: center; }
    .stanza:not(.gallery) .block { width: min(30rem, 88vw); text-align: center; }
    .stanza:not(.gallery) .block::before { inset: -10vh -12vw; }
    .line { font-size: clamp(20px, 5.2vw, 28px); }
  }
  @media (max-width: 480px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 6vw 5vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cue, #soundBtn[aria-pressed="true"] .eq i { animation: none; }
    .hero > *, .line, .rv, #gate, #soundBtn, #loader, .polaroid { transition-duration: 0.01s; transition-delay: 0s !important; }
    .line, .rv, .hero > * { filter: none; transform: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="fx"></canvas>
<div id="vignette"></div>
<div id="progress"></div>

<button id="soundBtn" type="button" aria-pressed="false">
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLbl">Sound</span>
</button>

<main>
  <section class="hero">
    <h1 id="title">Under the same moon</h1>
    <div class="cue" aria-hidden="true"></div>
  </section>
  <div id="stanzas"></div>
</main>

<div id="lightbox" role="dialog" aria-label="Photo, tap to close">
  <img id="lightboxImg" src="" alt="">
</div>

<div id="gate" role="dialog" aria-labelledby="gateLine">
  <div>
    <p id="gateLine">Best with sound</p>
    <div class="gate-actions">
      <button id="beginSound" type="button" class="solid">Begin with sound</button>
      <button id="beginQuiet" type="button">Begin quietly</button>
    </div>
  </div>
</div>

<div id="loader" role="status">Lighting the night sky…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);

  /* =====================================================================

  const Sound = (() => {

      { pad: [41, 48, 52, 57], arp: [65, 69, 72, 76, 77, 81] },  // F maj7

        const ch = CHORDS[chordIdx];

        const pat = PATTERN[stepIdx % PATTERN.length];
        if (Math.random() < 0.55 + 0.35 * intensity) pluck(nextTime + Math.random() * 0.02, ch.arp[pat], 0.6 + Math.random() * 0.5);
        if (intensity > 0.6 && stepIdx % 4 === 2 && Math.random() < 0.5) pluck(nextTime + STEP / 2, ch.arp[pat] + 12, 0.32);

    function setEnabled(on) {

        ctx.resume();
        const now = ctx.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setTargetAtTime(0.55, now, 0.8);
        if (!timer) { nextTime = ctx.currentTime + 0.2; timer = setInterval(schedule, 120); }

    }

      if (!enabled || !ctx) return;

      if (!enabled || !ctx) return;

      if (!ctx) return;

      isEnabled: () => enabled,
      supported: () => !!(window.AudioContext || window.webkitAudioContext)
    };
  })();

  /* ---------- Poem + gallery DOM ---------- */
  const $ = id => document.getElementById(id);
  const stanzasEl = $('stanzas');
  const heroEl = document.querySelector('.hero');
  const lightbox = $('lightbox'), lightboxImg = $('lightboxImg');
  const progressBar = $('progress');
  let secs = [];      // { el, kind: 'stanza' | 'heart' | 'gallery', side: +1 (Moon on the right) or -1 }
  let io = null;
  let entered = false;

  function mkLine(text, i, cls) {
    const p = document.createElement('p');
    p.className = cls || 'line';
    p.style.setProperty('--i', i);
    p.textContent = text;

  }

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightbox.classList.add('show');

  }
  function closeLightbox() { lightbox.classList.remove('show'); }
  lightbox.addEventListener('click', closeLightbox);

  function renderPoem() {
    stanzasEl.innerHTML = '';

      const sec = document.createElement('section');
      sec.className = 'stanza ' + (side === 1 ? 'left' : 'right');

      block.className = 'block';

    heartSec.className = 'stanza heart';

    gallerySec.className = 'stanza gallery';
    const gb = document.createElement('div');
    gb.className = 'block';
    gb.appendChild(mkLine(POEM.galleryTitle, 0));
    const grid = document.createElement('div');
    grid.className = 'gallery-grid';

  /* ---------- Renderer, scene, camera ---------- */
  const stage = $('stage');

  } catch (err) {

  }

  renderer.setPixelRatio(pixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;

  const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
  let dist = 4.9;
  camera.position.set(0, 0, dist);

  /* Sky: midnight indigo easing into a rose-plum horizon */
  (function makeSky() {
    const c = document.createElement('canvas'); c.width = 4; c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#05040f');
    grad.addColorStop(0.5, '#140a2c');
    grad.addColorStop(0.82, '#2d1346');
    grad.addColorStop(1, '#4d1f52');
    g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    scene.background = tex;
  })();

  /* Lights: warm sun, a rose rim from behind, a violet fill for the shadow side */

  scene.add(sun);
  const rim = new THREE.DirectionalLight(0xff9db8, 0.42);
  rim.position.set(-5, 1.2, -4);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0x3a2d66, 0.38));

  /* Moon: a root the drag turns, and a mesh inside it that rocks gently (libration) */
  const moonRoot = new THREE.Group();
  const moonMat = new THREE.MeshStandardMaterial({ color: 0x1a1518, roughness: 0.96, metalness: 0 });
  const moon = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), moonMat);

  moonRoot.quaternion.copy(HOME_ORIENT);
  scene.add(moonRoot);

    new THREE.SphereGeometry(1, 64, 32),
    new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(1.0, 0.72, 0.82) }, uStrength: { value: 0.5 } },
      vertexShader: `
        varying vec3 vN;
        void main() {
          vN = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

      fragmentShader: `
        uniform vec3 uColor; uniform float uStrength; varying vec3 vN;

    const c = document.createElement('canvas'); c.width = c.height = 256;

    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.4

  /* Twinkling stars in white, blush, gold and lavender */
  const starTints = [[1, 1, 1], [1, 0.8, 0.86], [1, 0.9, 0.7], [0.85, 0.82, 1]];

    const pos = new Float32Array(STAR_COUNT * 3), col = new Float32Array(STAR_COUNT * 3);

    for (let i = 0; i < STAR_COUNT; i++) {
      const z = rand() * 2 - 1, a = rand() * TAU, r = Math.sqrt(1 - z * z);
      pos[i * 3] = r * Math.cos(a) * 80; pos[i * 3 + 1] = z * 80; pos[i * 3 + 2] = r * Math.sin(a) * 80;
      const tint = starTints[Math.floor(rand() * starTints.length)];
      const b = 0.35 + 0.65 * Math.pow(rand(), 2);
      col[i * 3] = tint[0] * b; col[i * 3 + 1] = tint[1] * b; col[i * 3 + 2] = tint[2] * b;

    starGeo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    starGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    starGeo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));

  const starMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, pr: { value: pixelRatio } },
    vertexShader: `
      attribute float aSize; attribute float aPhase; attribute vec3 aColor;
      varying vec3 vColor; varying float vTw;
      uniform float time; uniform float pr;
      void main() {
        vColor = aColor;
        vTw = 0.62 + 0.38 * sin(time * (0.5 + aPhase * 1.5) + aPhase * 60.0);
        gl_PointSize = aSize * pr * (0.85 + 0.3 * vTw);

    fragmentShader: `
      varying vec3 vColor; varying float vTw;
      void main() {

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  scene.add(stars);

  /* ---------- The heart constellation: stars that join up around the Moon ---------- */
  const HEART_N = 16, MOON_PY = -4;
  const heartPts = [];
  for (let i = 0; i < HEART_N; i++) {
    const th = i / HEART_N * TAU;
    heartPts.push([
      16 * Math.pow(Math.sin(th), 3),
      13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th)
    ]);
  }
  const hMinY = Math.min(...heartPts.map(p => p[1])), hMaxY = Math.max(...heartPts.map(p => p[1]));
  const hCY = (hMinY + hMaxY) / 2;
  const heartLocal = heartPts.map(p => [p[0], p[1] - hCY]);
  const moonLocalY = MOON_PY - hCY;
  heartLocal.push(heartLocal[0]); // close the loop

  const heart = new THREE.Group();
  heart.visible = false;
  scene.add(heart);
  const heartGeo = new THREE.BufferGeometry();
  const heartPos = new Float32Array((HEART_N + 1) * 3);
  heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
  const heartLine = new THREE.Line(heartGeo, new THREE.LineBasicMaterial({
    color: 0xffc9dc, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  heartLine.frustumCulled = false;
  heart.add(heartLine);
  const starTex = radialSprite([[0, 'rgba(255,250,240,1)'], [0.25, 'rgba(255,225,205,0.85)'], [0.55, 'rgba(255,170,205,0.25)'], [1, 'rgba(255,170,205,0)']]);
  const heartStars = [];
  for (let i = 0; i < HEART_N; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: starTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
    sp.position.set(heartLocal[i][0], heartLocal[i][1], 0.01);
    heart.add(sp);
    heartStars.push(sp);
  }
  let heartP = 0, heartDone = false;

  function updateHeart(dt, t, kind, f, mx, my, Wh) {
    const target = kind === 'heart' ? 1 : 0;
    heartP += (target - heartP) * Math.min(1, (target > heartP ? 0.016 : 0.05) * dt);
    if (heartP < 0.003) heartP = 0;
    heart.visible = heartP > 0;
    if (!heart.visible) { heartDone = false; return; }
    const s = Wh / (f * 32);
    heart.scale.setScalar(s);
    heart.position.set(mx / f, my / f - moonLocalY * s, -1.2);

    const seg = heartP * HEART_N;
    const k = Math.min(HEART_N - 1, Math.floor(seg));
    const fr = clamp(seg - k, 0, 1);
    for (let i = 0; i <= k; i++) {
      heartPos[i * 3] = heartLocal[i][0]; heartPos[i * 3 + 1] = heartLocal[i][1]; heartPos[i * 3 + 2] = 0;
    }
    heartPos[(k + 1) * 3] = heartLocal[k][0] + (heartLocal[k + 1][0] - heartLocal[k][0]) * fr;
    heartPos[(k + 1) * 3 + 1] = heartLocal[k][1] + (heartLocal[k + 1][1] - heartLocal[k][1]) * fr;
    heartPos[(k + 1) * 3 + 2] = 0;
    heartGeo.setDrawRange(0, k + 2);
    heartGeo.attributes.position.needsUpdate = true;

    for (let i = 0; i < HEART_N; i++) {
      const rv = clamp(heartP * HEART_N - i, 0, 1);
      const tw = reduceMotion ? 1 : 0.75 + 0.25 * Math.sin(t * 2.1 + i * 1.7);
      heartStars[i].material.opacity = rv;
      const sz = (i % 4 === 0 ? 4.6 : 3.4) * rv * tw;
      heartStars[i].scale.set(sz, sz, 1);
    }
    if (heartP > 0.97 && !heartDone) { heartDone = true; Sound.flourish(); }
    if (heartP < 0.2) heartDone = false;
  }

  /* ---------- The Moon's surface: a real Moon map, sharpened with fine procedural detail ---------- */
  // Phones get a lighter texture and fewer craters baked, so the page builds
  // faster and scrolls more smoothly on weaker GPUs.
  const IS_PHONE = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || Math.min(window.innerWidth, window.innerHeight) < 700;
  const TW = IS_PHONE ? 1536 : 2048, TH = IS_PHONE ? 768 : 1024;

  async function buildMoonTextures() {
    const N = TW * TH;
    const lum = new Float32Array(N);
    const height = new Float32Array(N);
    const bright = new Float32Array(N);

    const cosLat = new Float32Array(TH), sinLat = new Float32Array(TH);
    const cosLon = new Float32Array(TW), sinLon = new Float32Array(TW);
    for (let y = 0; y < TH; y++) {
      const lat = (0.5 - (y + 0.5) / TH) * Math.PI;
      cosLat[y] = Math.cos(lat); sinLat[y] = Math.sin(lat);
    }
    for (let x = 0; x < TW; x++) {
      const lon = (x + 0.5) / TW * TAU;
      cosLon[x] = Math.cos(lon); sinLon[x] = Math.sin(lon);
    }

    loader.textContent = 'Unfolding the Moon…';
    await tick();
    let haveMap = true;
    try {
      const img = await loadImage(MOON_SRC);
      const c = document.createElement('canvas'); c.width = TW; c.height = TH;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
      g.drawImage(img, 0, 0, TW, TH);
      const d = g.getImageData(0, 0, TW, TH).data;
      for (let i = 0; i < N; i++) lum[i] = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) / 255;
    } catch (e) { haveMap = false; }

    loader.textContent = 'Smoothing the seas…';
    await tick();
    for (let y = 0; y < TH; y++) {
      const cy = cosLat[y], sy = sinLat[y];
      const pf = smoothstep(1.25, 1.5, Math.abs(Math.asin(sy))); // hide the stretched pole pixels
      for (let x = 0; x < TW; x++) {
        const i = y * TW + x;
        const dx = cy * cosLon[x], dy = sy, dz = cy * sinLon[x];
        let L = haveMap ? lum[i] : 0.3 + 0.5 * fbm(dx * 3 + 1, dy * 3 + 2, dz * 3 + 3, 4);
        if (pf > 0) {
          const Lp = 0.52 + 0.32 * (fbm(dx * 5 + 9, dy * 5 + 4, dz * 5 + 1, 3) - 0.5);
          L += (Lp - L) * pf;
        }
        L = clamp((L - 0.5) * 1.35 + 0.55, 0, 1);
        lum[i] = L;
        const rough = fbm(dx * 14, dy * 14, dz * 14, 3) - 0.5;
        height[i] = 0.008 * (L - 0.5) + 0.0022 * rough + (hash3(x, y, 7) - 0.5) * 0.00012;
      }
      if (y % 256 === 255) await tick();
    }

    loader.textContent = 'Striking small craters…';
    await tick();
    const craters = [];
    const NC = IS_PHONE ? 7000 : 12000, Rmin = 0.005, Rmax = 0.03;
    const q = 1 - (Rmin / Rmax) * (Rmin / Rmax);
    for (let i = 0; i < NC; i++) {
      const R = Rmin / Math.sqrt(1 - rand() * q);
      craters.push({ R, lat: Math.asin(rand() * 2 - 1), lon: rand() * TAU, young: rand() < 0.12 });
    }
    for (let ci = 0; ci < craters.length; ci++) {
      const c = craters[ci], R = c.R, ext = R * 2.2;
      const cl = Math.cos(c.lat), sl = Math.sin(c.lat), cLo = Math.cos(c.lon), sLo = Math.sin(c.lon);
      const yA = Math.max(0, Math.floor((0.5 - (c.lat + ext) / Math.PI) * TH));
      const yB = Math.min(TH - 1, Math.ceil((0.5 - (c.lat - ext) / Math.PI) * TH));
      let xA = 0, xB = TW - 1;
      if (Math.abs(c.lat) + ext < Math.PI / 2 - 0.001) {
        const dl = Math.min(Math.PI, ext / cl) / TAU * TW;
        const cx = c.lon / TAU * TW;
        xA = Math.floor(cx - dl); xB = Math.ceil(cx + dl);
        if (xB - xA + 1 >= TW) { xA = 0; xB = TW - 1; }
      }
      const cxi = clamp(Math.round(c.lon / TAU * TW), 0, TW - 1);
      const cyi = clamp(Math.round((0.5 - c.lat / Math.PI) * TH), 0, TH - 1);
      const mareK = smoothstep(0.55, 0.36, lum[cyi * TW + cxi]);
      const D = 0.16 * R * (1 - 0.5 * mareK);
      const cosExt = Math.cos(ext);
      for (let y = yA; y <= yB; y++) {
        const cy = cosLat[y], sy = sinLat[y], row = y * TW;
        for (let x = xA; x <= xB; x++) {
          const xx = ((x % TW) + TW) % TW;
          const dot = sy * sl + cy * cl * (cosLon[xx] * cLo + sinLon[xx] * sLo);
          if (dot < cosExt) continue;
          const t = Math.acos(dot > 1 ? 1 : dot) / R;
          let h = 0;
          if (t < 0.9) { const u = t / 0.9; h -= D * (1 - u * u); }
          const rr = (t - 1) / 0.16;
          h += 0.32 * D * Math.exp(-rr * rr);
          if (t > 1) h += 0.08 * D / (t * t * t);
          const idx = row + xx;
          height[idx] += h;
          if (c.young && t < 2.2) { const f = 1 - t / 2.2; bright[idx] += 0.08 * f * f; }
        }
      }
      if (ci % 2000 === 1999) await tick();
    }

    loader.textContent = 'Settling the dust…';
    await tick();
    const colorCanvas = document.createElement('canvas');
    const normalCanvas = document.createElement('canvas');
    colorCanvas.width = normalCanvas.width = TW;
    colorCanvas.height = normalCanvas.height = TH;
    const cctx = colorCanvas.getContext('2d'), nctx = normalCanvas.getContext('2d');
    const cimg = cctx.createImageData(TW, TH), nimg = nctx.createImageData(TW, TH);
    const cd = cimg.data, nd = nimg.data;
    const PX = TAU / TW, EXAG = 1.5;

    for (let y = 0; y < TH; y++) {
      const cx = Math.max(cosLat[y], 0.06);
      const yN = Math.max(y - 1, 0) * TW, yS = Math.min(y + 1, TH - 1) * TW, row = y * TW;
      for (let x = 0; x < TW; x++) {
        const i = row + x;
        const hE = height[row + (x + 1) % TW], hW = height[row + (x - 1 + TW) % TW];
        const hN = height[yN + x], hS = height[yS + x];
        const sx = (hE - hW) / (2 * PX * cx);
        const sy = (hN - hS) / (2 * PX);
        let nx = -sx * EXAG, ny = -sy * EXAG, nz = 1;
        const inv = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx *= inv; ny *= inv; nz *= inv;
        const o = i * 4;
        nd[o] = (nx * 0.5 + 0.5) * 255;
        nd[o + 1] = (ny * 0.5 + 0.5) * 255;
        nd[o + 2] = (nz * 0.5 + 0.5) * 255;
        nd[o + 3] = 255;

        const L = lum[i];
        const mk = smoothstep(0.55, 0.36, L); // dark seas lean mauve, highlands lean champagne
        const a = clamp(L + bright[i] + (hash3(x, y, 19) - 0.5) * 0.04, 0, 1);
        cd[o] = a * (1 - 0.09 * mk) * 255;
        cd[o + 1] = a * (0.955 - 0.06 * mk) * 255;
        cd[o + 2] = a * (0.875 + 0.04 * mk) * 255;
        cd[o + 3] = 255;
      }
      if (y % 256 === 255) await tick();
    }
    cctx.putImageData(cimg, 0, 0);
    nctx.putImageData(nimg, 0, 0);

    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    const colorTex = new THREE.CanvasTexture(colorCanvas);
    colorTex.encoding = THREE.sRGBEncoding;
    colorTex.anisotropy = maxAniso;
    const normalTex = new THREE.CanvasTexture(normalCanvas);
    normalTex.anisotropy = maxAniso;
    return { colorTex, normalTex };
  }

  /* ---------- Sunlight ---------- */
  const L3 = new THREE.Vector3();
  function updateSun(deg) {
    const a = deg * Math.PI / 180;
    L3.set(Math.sin(a), 0.16, Math.cos(a)).normalize();
    sun.position.copy(L3).multiplyScalar(10);
    const illum = (1 + L3.z) / 2;
    glow.material.opacity = 0.08 + 0.5 * illum * illum;
    limb.material.uniforms.uStrength.value = 0.15 + 0.6 * illum;
  }

  /* ---------- Turning the Moon, and making a wish on a tap ---------- */
  const axis = new THREE.Vector3(), dq = new THREE.Quaternion();
  let vx = 0, vy = 0, dragId = null, lx = 0, ly = 0, tapStart = null, lastDragEnd = 0;
  let gestureLock = null; // touch only: 'rotate' once a drag is clearly horizontal, 'scroll' once it's clearly vertical

  function rotateBy(dx, dy) {
    const angle = Math.hypot(dx, dy) * 0.0055 * (dist / 4.5);
    if (angle < 1e-6) return;
    axis.set(dy, dx, 0).normalize();
    dq.setFromAxisAngle(axis, angle);
    moonRoot.quaternion.premultiply(dq);
    moonRoot.quaternion.normalize();
  }
  const blocked = t => t && t.closest && t.closest('button, img, figure, #gate, #lightbox');
  const WISH_NOTES = [79, 81, 84, 86, 88, 91, 93, 96]; // a pentatonic scale, so any taps sound gentle together

  window.addEventListener('pointerdown', e => {
    if (blocked(e.target)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragId = e.pointerId; lx = e.clientX; ly = e.clientY; vx = vy = 0;
    tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
    // A mouse drag is always a rotate. A finger is ambiguous until it moves:
    // it might be turning the Moon, or it might just be scrolling the page.
    gestureLock = e.pointerType === 'mouse' ? 'rotate' : null;
    stage.classList.add('dragging');
  });
  window.addEventListener('pointermove', e => {
    if (e.pointerId !== dragId) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (gestureLock === null) {
      // Decide once the finger has moved enough to show clear intent, so a normal
      // vertical swipe scrolls the page untouched instead of also spinning the Moon.
      const tdx = e.clientX - tapStart.x, tdy = e.clientY - tapStart.y;
      if (Math.hypot(tdx, tdy) < 7) return;
      gestureLock = Math.abs(tdx) > Math.abs(tdy) * 1.15 ? 'rotate' : 'scroll';
      if (gestureLock === 'scroll') { stage.classList.remove('dragging'); return; }
    }
    if (gestureLock === 'scroll') return;
    lx = e.clientX; ly = e.clientY;
    rotateBy(dx, dy);
    vx = vx * 0.5 + dx * 0.5; vy = vy * 0.5 + dy * 0.5;
  });
  window.addEventListener('pointerup', e => {
    if (e.pointerId !== dragId) return;
    if (gestureLock !== 'scroll' && tapStart && entered && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 8 && performance.now() - tapStart.t < 450) {
      addWish(e.clientX, e.clientY);
      Sound.chime(WISH_NOTES[clamp(Math.floor(e.clientX / window.innerWidth * WISH_NOTES.length), 0, WISH_NOTES.length - 1)]);
    }
    dragId = null; tapStart = null; gestureLock = null; lastDragEnd = performance.now();
    stage.classList.remove('dragging');
  });
  window.addEventListener('pointercancel', e => {
    if (e.pointerId === dragId) { dragId = null; tapStart = null; gestureLock = null; lastDragEnd = performance.now(); stage.classList.remove('dragging'); }
  });

  /* ---------- Overlay: petals, a shooting star, and wishes ---------- */
  const fx = $('fx');
  const fctx = fx.getContext('2d');
  const petalColors = ['rgba(255,182,200,', 'rgba(240,140,172,', 'rgba(255,222,228,', 'rgba(224,120,160,'];
  let petals = [];
  function newPetal(initial) {
    return {
      x0: Math.random() * innerWidth,
      y: initial ? Math.random() * innerHeight : -30,
      s: 6 + Math.random() * 7,
      vy: 0.3 + Math.random() * 0.5,
      sw: Math.random() * TAU, swf: 0.4 + Math.random() * 0.8, amp: 14 + Math.random() * 30,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.02, flip: Math.random() * TAU,
      a: 0.22 + Math.random() * 0.3,
      c: petalColors[Math.floor(Math.random() * petalColors.length)]
    };
  }
  function petalPath(c) {
    c.beginPath();
    c.moveTo(0, -1);
    c.bezierCurveTo(0.95, -0.55, 0.85, 0.55, 0, 1);
    c.bezierCurveTo(-0.85, 0.55, -0.95, -0.55, 0, -1);
    c.closePath();
  }
  function heartPath(c, x, y, s) {
    c.beginPath();
    c.moveTo(x, y + s * 0.9);
    c.bezierCurveTo(x + s * 1.3, y + s * 0.1, x + s * 0.9, y - s * 1.0, x, y - s * 0.35);
    c.bezierCurveTo(x - s * 0.9, y - s * 1.0, x - s * 1.3, y + s * 0.1, x, y + s * 0.9);
    c.closePath();
  }
  const wishes = [];
  function addWish(x, y) {
    if (reduceMotion) return;
    const parts = [];
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * TAU, sp = 0.6 + Math.random() * 1.8;
      parts.push({ vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.7, r: 1 + Math.random() * 2.2, c: Math.random() < 0.5 ? '255,220,170' : '255,170,200' });
    }
    wishes.push({ x, y, t0: performance.now(), parts });
  }
  function drawWishes(now) {
    if (!wishes.length) return;
    fctx.globalCompositeOperation = 'lighter';
    for (let i = wishes.length - 1; i >= 0; i--) {
      const w = wishes[i];
      const k = (now - w.t0) / 1800;
      if (k >= 1) { wishes.splice(i, 1); continue; }
      const e = 1 - Math.pow(1 - k, 3);
      fctx.strokeStyle = 'rgba(255,210,225,' + (0.55 * (1 - k)) + ')';
      fctx.lineWidth = 1.2;
      fctx.beginPath(); fctx.arc(w.x, w.y, 10 + 70 * e, 0, TAU); fctx.stroke();
      for (const p of w.parts) {
        fctx.fillStyle = 'rgba(' + p.c + ',' + (0.9 * (1 - k)) + ')';
        fctx.beginPath();
        fctx.arc(w.x + p.vx * e * 60, w.y + p.vy * e * 60 - 30 * e * e, p.r * (1 - k * 0.6), 0, TAU);
        fctx.fill();
      }
      fctx.fillStyle = 'rgba(255,150,185,' + (0.85 * (1 - k)) + ')';
      heartPath(fctx, w.x, w.y - 40 * e, 9 * (0.6 + 0.4 * Math.min(1, k * 4)));
      fctx.fill();
    }
    fctx.globalCompositeOperation = 'source-over';
  }
  let shoot = null, nextShoot = performance.now() + 9000;
  function drawFx(now, dt, t) {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    if (reduceMotion) return;
    for (const p of petals) {
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      const x = p.x0 + Math.sin(t * p.swf + p.sw) * p.amp;
      if (p.y > innerHeight + 30) Object.assign(p, newPetal(false));
      const sx = 0.35 + 0.65 * Math.abs(Math.cos(t * 0.9 + p.flip));
      fctx.save();
      fctx.translate(x, p.y);
      fctx.rotate(p.rot);
      fctx.scale(p.s * sx, p.s * 1.5);
      fctx.fillStyle = p.c + p.a + ')';
      petalPath(fctx);
      fctx.fill();
      fctx.restore();
    }
    if (!shoot && entered && now > nextShoot) {
      shoot = { t0: now, x: innerWidth * (0.35 + Math.random() * 0.55), y: innerHeight * Math.random() * 0.3, len: 150 + Math.random() * 80 };
      nextShoot = now + 11000 + Math.random() * 9000;
    }
    if (shoot) {
      const k = (now - shoot.t0) / 1100;
      if (k > 1) { shoot = null; }
      else {
        const dx = -Math.cos(0.5), dy = Math.sin(0.5);
        const travel = k * innerWidth * 0.35;
        const hx = shoot.x + dx * travel, hy = shoot.y + dy * travel;
        const tx = hx - dx * shoot.len, ty = hy - dy * shoot.len;
        const g = fctx.createLinearGradient(hx, hy, tx, ty);
        g.addColorStop(0, 'rgba(255,240,225,' + (Math.sin(k * Math.PI) * 0.9) + ')');
        g.addColorStop(1, 'rgba(255,190,215,0)');
        fctx.strokeStyle = g; fctx.lineWidth = 1.6; fctx.lineCap = 'round';
        fctx.beginPath(); fctx.moveTo(hx, hy); fctx.lineTo(tx, ty); fctx.stroke();
      }
    }
  }

  /* ---------- Sizing ---------- */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + 'px';
    renderer.domElement.style.height = h + 'px';
    camera.aspect = aspect;
    // On tall screens widen the field of view so the whole Moon stays in frame
    camera.fov = aspect < 1 ? clamp(2 * Math.atan(1.32 / (4.1 * aspect)) * 180 / Math.PI, 34, 75) : 34;
    camera.updateProjectionMatrix();
    fx.width = w * pixelRatio; fx.height = h * pixelRatio;
    fx.style.width = w + 'px'; fx.style.height = h + 'px';
    fctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    petals = Array.from({ length: w < 700 ? 9 : 16 }, () => newPetal(true));
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- Render loop: scroll moves the Moon, its light and its music ----------
     The Moon's position, scale and distance are driven directly by a continuous
     0..1 value between each pair of sections (not snapped to whichever section is
     "nearest"), so it glides the whole time you scroll rather than jumping between
     rest states. A light exponential smoothing on top only irons out frame jitter. */
  let mx = 0, my = -2.6, ms = 1, sunDeg = 135, lastSoundPush = 0, lastScrollY = 0;
  let lastT = performance.now();
  updateSun(sunDeg);

  function frame(now) {
    const dt = Math.min((now - lastT) / 16.667, 3);
    lastT = now;
    const t = now * 0.001;
    const vh = window.innerHeight;
    const portrait = window.innerWidth / vh < 1;

    // progress through the poem (the moon is full by the last stanza)
    let lastStanzaTop = 1;
    for (let i = secs.length - 1; i >= 0; i--) if (secs[i].kind === 'stanza') { lastStanzaTop = Math.max(1, secs[i].el.offsetTop); break; }
    const q = clamp(window.scrollY / lastStanzaTop, 0, 1);
    const easeQ = q * q * (3 - 2 * q);

    // how far each section's centre sits from the viewport centre right now
    const nodes = [heroEl, ...secs.map(s => s.el)];
    const kinds = ['hero', ...secs.map(s => s.kind)];
    const ds = nodes.map(n => { const r = n.getBoundingClientRect(); return (r.top + r.bottom) / 2 - vh / 2; });
    let A = -1;
    for (let i = 0; i < ds.length; i++) { if (ds[i] <= 0) A = i; else break; }
    let B = A < 0 ? 0 : Math.min(A + 1, ds.length - 1);
    if (A < 0) A = 0;
    let su = 0;
    if (A !== B) su = clamp(ds[A] / (ds[A] - ds[B]), 0, 1);
    su = su * su * (3 - 2 * su); // smoothstep: an eased glide between the two sections

    function distFor(kind) {
      if (kind === 'heart') return 5.2;
      if (kind === 'gallery') return 5.6;
      return 4.9 - 0.8 * easeQ;
    }
    const distT = distFor(kinds[A]) + (distFor(kinds[B]) - distFor(kinds[A])) * su;
    dist += (distT - dist) * Math.min(1, 0.12 * dt);
    camera.position.z = dist;
    const halfW = Math.tan(camera.fov * Math.PI / 360) * dist * camera.aspect;
    const halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
    const Wh = Math.min(2.6, halfW * 1.85);

    function posFor(kind) {
      // The Moon holds dead centre for the whole poem — it doesn't sway, drift,
      // or hop between the hero and each stanza. Only its size, distance, glow
      // and light still change, so the "activity" reads as the Moon itself
      // coming alive (growing, brightening, turning) rather than sliding around
      // the screen. The photo gallery is the one exception: the Moon lifts
      // slightly so it doesn't sit on top of the photos underneath it.
      if (kind === 'gallery') return { x: 0, y: 1.1, s: 0.16 * Wh };
      return { x: 0, y: 0, s: kind === 'heart' ? 0.22 * Wh : 1 };
    }
    const pA = posFor(kinds[A]), pB = posFor(kinds[B]);
    const tx = pA.x + (pB.x - pA.x) * su;
    const ty = pA.y + (pB.y - pA.y) * su;
    const scaleT = pA.s + (pB.s - pA.s) * su;
    const kind = su < 0.5 ? kinds[A] : kinds[B]; // whichever section we're closer to right now

    mx += (tx - mx) * Math.min(1, 0.16 * dt);
    my += (ty - my) * Math.min(1, 0.16 * dt);
    ms += (scaleT - ms) * Math.min(1, 0.16 * dt);
    const bob = reduceMotion ? 0 : Math.sin(t * 0.6) * 0.025;
    const py = my + bob;
    moonRoot.position.set(mx, py, 0);
    moonRoot.scale.setScalar(ms);
    limb.position.set(mx, py, 0);
    limb.scale.setScalar(1.13 * ms);
    if (!reduceMotion) { moon.rotation.y = Math.sin(t * 0.17) * 0.09; moon.rotation.x = Math.sin(t * 0.11) * 0.05; }

    // a light turn as you scroll, so the Moon feels awake to it, not just its light and place
    const scrollDelta = window.scrollY - lastScrollY;
    lastScrollY = window.scrollY;
    if (!reduceMotion && dragId === null && Math.abs(scrollDelta) > 0.05) rotateBy(clamp(scrollDelta * 0.06, -5, 5), 0);

    // sunlight: a thin crescent grows to full, then stays full through the heart and gallery
    const sunT = 135 - 127 * easeQ;
    sunDeg += (sunT - sunDeg) * Math.min(1, 0.05 * dt);
    updateSun(sunDeg);

    const breathe = reduceMotion ? 1 : 1 + 0.025 * Math.sin(t * 0.8);
    const gs = 6.6 * breathe * Math.pow(ms, 0.6);
    glow.position.set(mx, py, -1.5);
    glow.scale.set(gs, gs, 1);

    // let go of a drag: coast, then drift home so the familiar face returns
    if (dragId === null) {
      vx *= Math.pow(0.94, dt); vy *= Math.pow(0.94, dt);
      if (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01) rotateBy(vx * dt, vy * dt);
      else if (now - lastDragEnd > 4000) moonRoot.quaternion.slerp(HOME_ORIENT, Math.min(1, 0.012 * dt));
    }

    const f = dist / (dist + 1.2);
    updateHeart(dt, t, kind, f, mx, py, Wh);

    starMat.uniforms.time.value = reduceMotion ? 0 : t;
    if (!reduceMotion) stars.rotation.y += 0.00003 * dt;

    // a thin gold line across the top tracks how far through the poem you are
    const docH = document.documentElement.scrollHeight - vh;
    progressBar.style.width = (docH > 0 ? clamp(window.scrollY / docH, 0, 1) * 100 : 0) + '%';

    if (now - lastSoundPush > 250) { Sound.setIntensity(kind === 'hero' ? 0 : (kind === 'stanza' ? easeQ : 1)); lastSoundPush = now; }

    renderer.render(scene, camera);
    drawFx(now, dt, t);
    drawWishes(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Gate and sound button ---------- */
  const soundBtn = $('soundBtn');
  function refreshSoundBtn() { soundBtn.setAttribute('aria-pressed', String(Sound.isEnabled())); }
  if (Sound.supported()) soundBtn.classList.add('available');
  function enter(withSound) {
    if (entered) return;
    entered = true;
    if (withSound) Sound.setEnabled(true);
    refreshSoundBtn();
    document.body.classList.add('ready');
  }
  $('beginSound').addEventListener('click', () => enter(true));
  $('beginQuiet').addEventListener('click', () => enter(false));
  soundBtn.addEventListener('click', () => { Sound.setEnabled(!Sound.isEnabled()); refreshSoundBtn(); });
  if (!Sound.supported()) $('beginSound').style.display = 'none';

  /* ---------- Build the surface, then open the gate ---------- */
  buildMoonTextures().then(({ colorTex, normalTex }) => {
    moonMat.map = colorTex;
    moonMat.normalMap = normalTex;
    moonMat.normalScale = new THREE.Vector2(1, 1);
    moonMat.color.set(0xffffff);
    moonMat.needsUpdate = true;
    loader.classList.add('gone');
    document.body.classList.add('loaded');
  });
})();
</script>
</body>
</html>
